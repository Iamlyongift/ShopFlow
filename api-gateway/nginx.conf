events {
  worker_connections 1024;
}

http {
  # ── Upstream service pools ──────────────────────────────────────────────────
  upstream user_service {
    server user-service:3001;
  }

  upstream product_service {
    server product-service:3002;
  }

  upstream order_service {
    server order-service:3003;
  }

  upstream notification_service {
    server notification-service:3004;
  }

  # ── Main server block ───────────────────────────────────────────────────────
  server {
    listen 80;
    server_name localhost;

    # Gateway health check
    location /health {
      return 200 'api-gateway is up\n';
      add_header Content-Type text/plain;
    }

    # Route /api/users → user-service (Spring Boot :3001)
    location /api/users {
      proxy_pass         http://user_service;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Route /api/products → product-service (Node :3002)
    location /api/products {
      proxy_pass         http://product_service;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Route /api/orders → order-service (Spring Boot :3003)
    location /api/orders {
      proxy_pass         http://order_service;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}