events {
  worker_connections 1024;
}

http {
  # ── Upstream service pools ──────────────────────────────────────────────────
  upstream user_service {
    server user-service:3001;
  }

  upstream product_service {
    server product-service:3002;
  }

  upstream order_service {
    server order-service:3003;
  }

  upstream notification_service {
    server notification-service:3004;
  }

  upstream auth_service {
    server auth-service:3005;
  }

  # ── Main server block ───────────────────────────────────────────────────────
  server {
    listen 80;
    server_name localhost;

    # Gateway health check (public)
    location /health {
      return 200 'api-gateway is up\n';
      add_header Content-Type text/plain;
    }

    # ── Public routes (no token required) ─────────────────────────────────────

    # Login and register are public — user doesn't have a token yet
    location /api/auth {
      proxy_pass         http://auth_service;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Internal auth validation (called by Nginx, not the client) ────────────

    # Nginx calls this internally via auth_request
    # Client never hits this directly
    location = /internal/auth/validate {
      internal;
      proxy_pass         http://auth_service/api/auth/validate;
      proxy_pass_request_body off;
      proxy_set_header   Content-Length "";
      proxy_set_header   Authorization $http_authorization;
    }

    # ── Protected routes (token required) ─────────────────────────────────────

    # Route /api/users → user-service (protected)
    location /api/users {
      auth_request /internal/auth/validate;
      error_page 401 = @unauthorized;

      proxy_pass         http://user_service;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   Authorization $http_authorization;
    }

    # Route /api/products → product-service (protected)
    location /api/products {
      auth_request /internal/auth/validate;
      error_page 401 = @unauthorized;

      proxy_pass         http://product_service;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   Authorization $http_authorization;
    }

    # Route /api/orders → order-service (protected)
    location /api/orders {
      auth_request /internal/auth/validate;
      error_page 401 = @unauthorized;

      proxy_pass         http://order_service;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   Authorization $http_authorization;
    }

    # ── Unauthorized response block ────────────────────────────────────────────
    location @unauthorized {
      return 401 '{"error": "Missing or invalid token. Please login first."}';
      add_header Content-Type application/json;
    }
  }
}